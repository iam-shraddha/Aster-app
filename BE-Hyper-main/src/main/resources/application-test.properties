# Test Configuration - H2 In-Memory Database
spring.application.name=ImplantCar

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA Config for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging
logging.level.org.hibernate.SQL=DEBUG

# Auth0 Configuration (same as main)
auth0.domain=dev-bi25-v79.us.auth0.com
auth0.clientId=LwIfwh3CTenr8ceVEAaNijsTlbtAoK5k
auth0.clientSecret=0Y2Zda1Ajqiwg1Z-mI27iRY6uhlqh6gtSqWIoImRu-FLSgNdeRqLw_EB6DEewawp
auth0.audience=https://hyperminds.com/

server.port=8080
server.servlet.session.timeout=24h
spring.jpa.defer-datasource-initialization=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
